<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grand Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root{
  --sky1:#b8e4f9;--sky2:#e0f3ff;--sky3:#f0faff;
  --aqua:#1ea5c8;--aqua2:#14829e;--aqua-g:rgba(30,165,200,.12);
  --teal:#0e9a83;--teal-g:rgba(14,154,131,.1);
  --green:#3ec47e;--green-lt:#b8f0d0;
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.72);--glass3:rgba(255,255,255,.38);
  --frost:rgba(255,255,255,.18);
  --red-a:#e05454;--red-bg:rgba(224,84,84,.08);--blue-a:#3b7ddb;--blue-bg:rgba(59,125,219,.08);
  --txt:#1a3a4a;--txt2:#4a7080;--txt3:#8aa8b8;
  --bdr:rgba(255,255,255,.5);--bdr2:rgba(0,80,120,.08);
  --shadow:0 2px 16px rgba(0,60,100,.07),0 1px 3px rgba(0,60,100,.05);
  --shadow-lg:0 8px 32px rgba(0,60,100,.1),0 2px 8px rgba(0,60,100,.06);
  --ff:'Outfit',sans-serif;--ff2:'Inter',sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:var(--ff);color:var(--txt);font-size:15px;overflow-x:hidden;
  background:linear-gradient(175deg,#7ec8e3 0%,#b8e4f9 18%,#d4f0ff 35%,#e8f7f0 55%,#d5eedd 75%,#c2e6c8 100%);
  background-attachment:fixed;min-height:100vh}

/* Floating orbs */
#orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}

.wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:24px 18px 60px}

/* Header */
.hdr{text-align:center;padding:18px 0 4px}
.hdr h1{font-family:var(--ff);font-size:clamp(1.6rem,4.5vw,2.5rem);font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(135deg,#0c7c9e 0%,#14a8a0 40%,#3ec47e 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 1px 2px rgba(0,100,80,.15))}
.hdr-sub{font-size:.65rem;color:var(--txt3);letter-spacing:.18em;text-transform:uppercase;margin-top:1px;font-weight:500}
.divider{width:50px;height:2px;margin:10px auto 20px;background:linear-gradient(90deg,transparent,rgba(30,165,200,.3),transparent);border-radius:1px}

/* Glass panels */
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.glass-strong{background:var(--glass2);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.6);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:18px 20px}

/* Nav */
.nav{display:flex;justify-content:center;gap:3px;margin-bottom:20px;background:var(--glass3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:10px;padding:4px;border:1px solid var(--bdr)}
.nav-btn{font-family:var(--ff);font-size:.72rem;font-weight:600;padding:6px 16px;background:0;color:var(--txt2);border:none;border-radius:7px;cursor:pointer;transition:.25s}
.nav-btn:hover{color:var(--txt);background:rgba(255,255,255,.4)}
.nav-btn.on{background:rgba(255,255,255,.7);color:var(--aqua2);box-shadow:0 1px 6px rgba(0,80,120,.08)}

/* Inputs */
.label{font-family:var(--ff);font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--aqua2);margin-bottom:3px}
input,select,textarea{background:rgba(255,255,255,.6);border:1px solid rgba(0,80,120,.1);color:var(--txt);padding:8px 11px;border-radius:8px;font-family:var(--ff);font-size:.84rem;outline:0;transition:.2s;width:100%;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
input:focus,select:focus,textarea:focus{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(30,165,200,.1)}
select{cursor:pointer}textarea{resize:vertical;min-height:42px}
optgroup{font-weight:700;color:var(--txt2);font-family:var(--ff2);font-size:.76rem}

/* Mode pills */
.mode-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.mode-pill{font-size:.7rem;font-weight:600;padding:6px 14px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.6);border-radius:20px;cursor:pointer;color:var(--txt2);transition:.2s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mode-pill:hover{background:rgba(255,255,255,.7);color:var(--txt);border-color:rgba(30,165,200,.2)}
.mode-pill.on{background:linear-gradient(135deg,rgba(30,165,200,.12),rgba(62,196,126,.1));border-color:var(--aqua);color:var(--aqua2);box-shadow:0 1px 8px rgba(30,165,200,.12)}

/* Matchup */
.matchup{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-bottom:14px}
.matchup-vs{font-weight:900;font-size:.75rem;padding-bottom:10px;text-align:center;background:linear-gradient(135deg,var(--red-a),var(--aqua),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Presets */
.presets-strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none;margin-bottom:14px}
.presets-strip::-webkit-scrollbar{display:none}
.preset{font-size:.68rem;font-weight:500;padding:5px 11px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.5);border-radius:14px;cursor:pointer;color:var(--txt2);transition:.2s;white-space:nowrap;flex-shrink:0}
.preset:hover{background:rgba(255,255,255,.65);color:var(--txt)}
.preset.on{background:linear-gradient(135deg,rgba(30,165,200,.1),rgba(62,196,126,.08));border-color:var(--aqua);color:var(--aqua2)}

/* Settings bar */
.settings-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:rgba(255,255,255,.35);border:1px solid var(--bdr);border-radius:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.setting{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--txt2)}
.s-label{font-size:.56rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--aqua2)}
.s-slider{-webkit-appearance:none;width:64px;height:3px;background:rgba(0,80,120,.08);border-radius:2px;outline:0;padding:0}
.s-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:linear-gradient(135deg,var(--aqua),var(--teal));border-radius:50%;cursor:pointer;box-shadow:0 1px 4px rgba(0,100,80,.2)}
.s-num{font-family:var(--ff2);font-weight:700;color:var(--aqua2);font-size:.78rem;min-width:18px}
.s-toggle{width:30px;height:16px;background:rgba(0,80,120,.1);border-radius:8px;cursor:pointer;position:relative;transition:.2s;border:0}
.s-toggle.on{background:linear-gradient(135deg,var(--aqua),var(--teal))}
.s-toggle::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.s-toggle.on::after{transform:translateX(14px)}
.s-sep{width:1px;height:18px;background:rgba(0,80,120,.06);flex-shrink:0}

/* Fight button — glossy Aero style */
.fight-btn{display:block;width:100%;padding:14px;font-family:var(--ff);font-size:.92rem;font-weight:800;letter-spacing:.04em;
  background:linear-gradient(180deg,#2bc4a0 0%,#18a88a 45%,#0e9070 100%);
  color:#fff;border:none;border-radius:10px;cursor:pointer;text-transform:uppercase;position:relative;overflow:hidden;
  box-shadow:0 2px 12px rgba(14,144,112,.25),inset 0 1px 0 rgba(255,255,255,.35);transition:.3s;margin-top:4px;text-shadow:0 1px 2px rgba(0,60,40,.2)}
.fight-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent);border-radius:10px 10px 0 0;pointer-events:none}
.fight-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(14,144,112,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.fight-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* Buttons */
.btn{padding:7px 14px;font-family:var(--ff);font-size:.7rem;font-weight:600;background:rgba(255,255,255,.5);border:1px solid rgba(0,80,120,.08);color:var(--txt2);border-radius:7px;cursor:pointer;transition:.2s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn:hover{background:rgba(255,255,255,.75);color:var(--txt);border-color:rgba(30,165,200,.15)}
.btn-d{border-color:rgba(224,84,84,.15);color:var(--red-a)}.btn-d:hover{background:rgba(224,84,84,.06)}

/* Error / Warning */
.err-box{background:rgba(224,84,84,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(224,84,84,.15);color:var(--red-a);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:.78rem;font-weight:500;display:none}
.err-box.vis{display:block}
.warn-box{background:rgba(30,165,200,.06);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(30,165,200,.15);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:.74rem;color:var(--aqua2);display:flex;justify-content:space-between;align-items:center;gap:6px}

/* Battle */
.phase-bar{text-align:center;color:var(--aqua2);font-size:.82rem;font-weight:600;margin-bottom:8px;display:flex;justify-content:center;align-items:center;gap:8px}
.pulse{display:inline-block;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.arena-grid{display:grid;grid-template-columns:1fr 28px 1fr;gap:0}
.col-hdr{font-size:.76rem;font-weight:700;padding:8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.col-a{background:linear-gradient(135deg,rgba(224,84,84,.08),rgba(224,84,84,.03));color:var(--red-a);border-bottom:2px solid rgba(224,84,84,.15);border-radius:var(--r) var(--r) 0 0}
.col-b{background:linear-gradient(135deg,rgba(59,125,219,.08),rgba(59,125,219,.03));color:var(--blue-a);border-bottom:2px solid rgba(59,125,219,.15);border-radius:var(--r) var(--r) 0 0}
.prov-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.55rem;font-weight:700;font-family:var(--ff2);letter-spacing:.02em}
.msgs{height:360px;overflow-y:auto;padding:10px;background:rgba(255,255,255,.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.5);border-top:none;border-radius:0 0 var(--r) var(--r);scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:4px}.msgs::-webkit-scrollbar-thumb{background:rgba(0,80,120,.08);border-radius:2px}
.msg{margin-bottom:8px;padding:9px 11px;border-radius:10px;font-size:.82rem;line-height:1.55;animation:msgin .3s ease-out}
@keyframes msgin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg-a{background:rgba(224,84,84,.04);border-left:3px solid rgba(224,84,84,.2)}
.msg-b{background:rgba(59,125,219,.04);border-left:3px solid rgba(59,125,219,.2)}
.msg-rnd{font-size:.52rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:3px}
.msg code{background:rgba(0,80,120,.06);padding:1px 4px;border-radius:3px;font-family:var(--ff2);font-size:.78rem}
.msg pre{background:rgba(0,80,120,.05);padding:8px 10px;border-radius:6px;overflow-x:auto;margin:6px 0;font-family:var(--ff2);font-size:.76rem;line-height:1.5;border:1px solid rgba(0,80,120,.06)}
.msg pre code{background:none;padding:0}
.msg em{font-style:italic;color:var(--txt2)}
.msg strong{font-weight:700;color:var(--txt)}
.msg .katex-display{margin:8px 0;overflow-x:auto}
.msg .katex{font-size:.88em}
.msg ul,.msg ol{margin:4px 0 4px 18px;font-size:.82rem}
.msg li{margin-bottom:2px}
.msg blockquote{border-left:3px solid rgba(0,80,120,.1);padding-left:10px;margin:4px 0;color:var(--txt2);font-style:italic}
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--txt3);font-style:italic;font-size:.78rem}
.vs-col{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}
.vs-txt{font-weight:900;font-size:.8rem;background:linear-gradient(135deg,var(--red-a),var(--aqua),var(--blue-a));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.vs-line{width:1px;flex:1;background:linear-gradient(to bottom,transparent,rgba(0,80,120,.06),transparent)}
.cooldown-wrap{display:none;margin-bottom:8px;text-align:center}
.cooldown-lbl{font-size:.56rem;font-weight:600;color:var(--txt3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.cooldown-track{height:3px;background:rgba(0,80,120,.05);border-radius:2px;overflow:hidden}
.cooldown-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--aqua),var(--green));border-radius:2px}

/* Judgment */
.judgment{margin-top:16px;background:var(--glass2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.6);border-radius:var(--r);padding:18px 16px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);animation:jIn .5s ease-out}
@keyframes jIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.judgment::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red-a),var(--aqua),var(--teal),var(--green));border-radius:3px 3px 0 0}
.j-title{font-size:1.05rem;font-weight:900;text-align:center;color:var(--aqua2);margin-bottom:2px}
.j-sub{text-align:center;font-size:.55rem;color:var(--txt3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;font-weight:600}
.actions{display:flex;justify-content:center;gap:6px;margin-top:14px;flex-wrap:wrap}

/* History */
.hist-row{background:rgba(255,255,255,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:9px 11px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;gap:6px;transition:.2s}
.hist-row:hover{background:rgba(255,255,255,.6)}
.h-left{min-width:0;flex:1}.h-match{font-weight:700;font-size:.76rem;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-meta{font-size:.6rem;color:var(--txt3);font-weight:500}
.h-win{font-weight:700;font-size:.66rem;padding:3px 7px;border-radius:6px;white-space:nowrap}
.w-a{color:var(--red-a);background:var(--red-bg)}.w-b{color:var(--blue-a);background:var(--blue-bg)}.w-d{color:var(--aqua2);background:var(--aqua-g)}

/* Leaderboard */
.lb-row{display:grid;grid-template-columns:28px 1fr auto 50px 40px;gap:4px;align-items:center;padding:8px 10px;background:rgba(255,255,255,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.5);border-radius:8px;margin-bottom:3px;font-size:.76rem}
.lb-rank{font-weight:900;text-align:center}.lb-name{font-weight:600}
.lb-elo{font-family:var(--ff2);font-size:.72rem;font-weight:700;text-align:right}
.lb-bar{height:3px;border-radius:2px;min-width:20px}

/* Keys */
.keys-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:5px}
.key-item{background:rgba(255,255,255,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;transition:.2s}
.key-item:hover{background:rgba(255,255,255,.6)}
.key-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.key-name{font-size:.7rem;font-weight:700;min-width:72px}
.key-item input{flex:1;font-size:.74rem;padding:5px 8px}
.key-hint{font-size:.54rem;color:var(--txt3);font-weight:500}

.section{display:none}.section.vis{display:block}
@keyframes sa{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px) rotate(-.2deg)}75%{transform:translateX(2px) rotate(.2deg)}}
@keyframes sb{0%,100%{transform:translateX(0)}25%{transform:translateX(2px) rotate(.2deg)}75%{transform:translateX(-2px) rotate(-.2deg)}}
.sa{animation:sa .4s ease-in-out}.sb{animation:sb .4s ease-in-out}
@media(max-width:700px){.arena-grid{grid-template-columns:1fr;gap:8px}.vs-col{flex-direction:row;padding:3px 0}.vs-line{height:1px;width:auto;flex:1;background:linear-gradient(to right,transparent,rgba(0,80,120,.06),transparent)}.matchup{grid-template-columns:1fr}.matchup-vs{display:none}.msgs{height:200px}.settings-bar{flex-direction:column;align-items:stretch;gap:8px}.s-sep{display:none}.keys-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="orbs"></canvas>
<div class="wrap">
  <header class="hdr"><h1>The Grand Arena</h1><div class="hdr-sub">Multi-Provider LLM Battleground</div><div class="divider"></div></header>
  <nav class="nav" id="nav"></nav>
  <div class="err-box" id="errBox"></div>

  <div class="section" id="sec-keys">
    <div class="glass" style="margin-bottom:0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span class="label" style="margin:0;font-size:.68rem">API Keys <span style="font-weight:400;color:var(--txt3);text-transform:none;letter-spacing:0"> — saved locally</span></span>
        <button class="btn" id="toggleKeysVis" style="font-size:.62rem;padding:3px 10px">Show</button>
      </div>
      <div class="keys-list" id="keysList"></div>
    </div>
  </div>

  <div class="section vis" id="sec-arena">
    <div id="setupPanel">
      <div class="glass-strong">
        <div id="warnBox" style="display:none"></div>
        <div class="mode-row" id="modeRow"></div>
        <div class="matchup">
          <div><div class="label" style="color:var(--red-a)">Challenger A</div><select id="selA"></select></div>
          <div class="matchup-vs">VS</div>
          <div><div class="label" style="color:var(--blue-a)">Challenger B</div><select id="selB"></select></div>
        </div>
        <div class="settings-bar">
          <div class="setting"><span class="s-label">Judge</span><select id="selJ" style="width:auto;min-width:130px;font-size:.74rem;padding:5px 8px"></select></div>
          <div class="s-sep"></div>
          <div class="setting"><span class="s-label">Rounds</span><input type="range" class="s-slider" id="roundsSlider" min="1" max="6" value="3"><span class="s-num" id="roundsNum">3</span></div>
          <div class="s-sep"></div>
          <div class="setting"><span class="s-label">Delay</span><input type="range" class="s-slider" id="delaySlider" min="0" max="15" value="2"><span class="s-num" id="delayNum">2s</span></div>
          <div class="s-sep"></div>
          <div class="setting"><span class="s-label">Auto-Judge</span><button class="s-toggle on" id="autoJBtn"></button></div>
        </div>
        <div style="margin-bottom:3px"><div class="label">Topic Presets</div><div class="presets-strip" id="presetsRow"></div></div>
        <textarea id="topicInput" placeholder="Or type a custom topic..."></textarea>
        <button class="fight-btn" id="fightBtn" disabled>&#x2694;&#xFE0F; Begin the Battle</button>
      </div>
    </div>
    <div id="battlePanel" style="display:none">
      <div class="phase-bar"><span id="timerDisp" style="font-family:var(--ff2);color:var(--txt3);font-size:.72rem;font-weight:600">00:00</span><span style="opacity:.15">|</span><span id="phaseDisp"></span></div>
      <div class="cooldown-wrap" id="cooldownWrap"><div class="cooldown-lbl" id="cooldownLabel"></div><div class="cooldown-track"><div class="cooldown-fill" id="cooldownBar"></div></div></div>
      <div class="arena-grid">
        <div id="colA"><div class="col-hdr col-a"><span id="colAName"></span><span id="colABadge"></span></div><div class="msgs" id="msgsA"><div class="empty">Awaiting...</div></div></div>
        <div class="vs-col"><div class="vs-line"></div><div class="vs-txt">VS</div><div class="vs-line"></div></div>
        <div id="colB"><div class="col-hdr col-b"><span id="colBName"></span><span id="colBBadge"></span></div><div class="msgs" id="msgsB"><div class="empty">Awaiting...</div></div></div>
      </div>
      <div class="actions" id="battleActions"></div>
      <div id="judgmentBox" style="display:none"></div>
      <div class="actions" id="resultActions" style="display:none"></div>
    </div>
  </div>

  <div class="section" id="sec-history">
    <div class="glass">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span class="label" style="margin:0;font-size:.68rem">Battle History</span>

async function callModel(provId,apiKey,modelId,msgs,temp=.9,maxTok=400){
  const prov=PROVIDERS[provId];if(!prov)throw new Error("Unknown provider: "+provId);
  for(let att=0;att<=4;att++){
    const h={"Content-Type":"application/json"};let res;
    if(prov.format==="anthropic"){
      h["x-api-key"]=apiKey;h["anthropic-version"]="2023-06-01";h["anthropic-dangerous-direct-browser-access"]="true";
      const sys=msgs.find(m=>m.role==="system"),rest=msgs.filter(m=>m.role!=="system");
      const body={model:modelId,max_tokens:maxTok,temperature:temp,messages:rest};if(sys)body.system=sys.content;
      res=await fetch(prov.url,{method:"POST",headers:h,body:JSON.stringify(body)});
    }else{
      h["Authorization"]="Bearer "+apiKey;if(provId==="openrouter")h["HTTP-Referer"]=location.href;
      res=await fetch(prov.url,{method:"POST",headers:h,body:JSON.stringify({model:modelId,messages:msgs,max_tokens:maxTok,temperature:temp})});
    }
    if(res.status===429){if(att===4)throw new Error(prov.name+" rate limited after retries. Increase delay.");const w=Math.max((parseInt(res.headers.get("retry-after"))||0)*1000,(2**att)*2000+Math.random()*1000);await showCD(Math.ceil(w/1000),"Rate limited \u2014 retry "+(att+1));continue}
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e?.error?.message||prov.name+" error "+res.status)}
    const data=await res.json();
    if(prov.format==="anthropic")return(data.content||[]).map(b=>b.text).join("")||"(No response)";
    return data.choices?.[0]?.message?.content||"(No response)";
  }
}

/* Strip <think>, <reasoning>, <thought>, etc. from model outputs */
function cleanResponse(text){
  if(!text)return"";
  // Remove <think>...</think> and variants (Qwen, DeepSeek R1, etc.) — greedy across newlines
  text=text.replace(/<(think|thinking|reasoning|thought|reflection|inner_monologue|scratchpad)[\s\S]*?<\/\1>/gi,"");
  // Remove unclosed <think> blocks (model started thinking but never closed)
  text=text.replace(/<(think|thinking|reasoning|thought|reflection|inner_monologue|scratchpad)[^>]*>[\s\S]*/gi,"");
  // Clean leftover whitespace
  return text.replace(/^\s*\n+/,"").replace(/\n{3,}/g,"\n\n").trim();
}

/* Render markdown + LaTeX to HTML */
function renderContent(raw){
  let t=esc(raw);
  // LaTeX: display math $$...$$ first
  t=t.replace(/\$\$([\s\S]*?)\$\$/g,function(_,m){try{return'<div class="katex-display">'+katex.renderToString(m.trim(),{displayMode:true,throwOnError:false})+'</div>'}catch{return esc(m)}});
  // LaTeX: inline math $...$  (not greedy, avoid $5 price matches)
  t=t.replace(/\$([^\$\n]+?)\$/g,function(_,m){if(/^\d+(\.\d+)?$/.test(m.trim()))return"$"+m+"$";try{return katex.renderToString(m.trim(),{throwOnError:false})}catch{return esc(m)}});
  // Code blocks ```...```
  t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,function(_,lang,code){return'<pre><code>'+code.replace(/</g,"&lt;")+'</code></pre>'});
  // Inline code `...`
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  // Bold **...**
  t=t.replace(/\*\*([^\*]+?)\*\*/g,'<strong>$1</strong>');
  // Italic *...*
  t=t.replace(/(?<!\*)\*([^\*]+?)\*(?!\*)/g,'<em>$1</em>');
  // Blockquote > ...
  t=t.replace(/^&gt;\s?(.+)$/gm,'<blockquote>$1</blockquote>');
  // Unordered lists - ...
  t=t.replace(/^[-*]\s+(.+)$/gm,'<li>$1</li>');
  t=t.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');
  t=t.replace(/<\/ul>\s*<ul>/g,'');
  // Headers ### ...
  t=t.replace(/^###\s+(.+)$/gm,'<strong style="font-size:.88rem">$1</strong>');
  t=t.replace(/^##\s+(.+)$/gm,'<strong style="font-size:.92rem;color:var(--aqua2)">$1</strong>');
  // Line breaks
  t=t.replace(/\n/g,'<br>');
  // Clean double <br>
  t=t.replace(/(<br>\s*){3,}/g,'<br><br>');
  return t;
}

  document.getElementById("toggleKeysVis").textContent=S.showKeys?"Hide":"Show";document.getElementById("toggleKeysVis").onclick=()=>{S.showKeys=!S.showKeys;render()};
  // History
  const hl=document.getElementById("histList");document.getElementById("clearHistBtn").style.display=S.hist.length?"":"none";
  if(!S.hist.length)hl.innerHTML='<div style="text-align:center;color:var(--txt3);padding:24px;font-style:italic;font-size:.8rem">No battles yet.</div>';
  else hl.innerHTML=S.hist.map(h=>{const nA=gn(h.modelA),nB=gn(h.modelB),wc=h.winner===nA?"w-a":h.winner===nB?"w-b":"w-d";return`<div class="hist-row"><div class="h-left"><div class="h-match">${esc(nA)} vs ${esc(nB)}</div><div class="h-meta">${h.mode} \u2022 ${h.rounds}R \u2022 ${new Date(h.date).toLocaleDateString()} \u2022 ${h.scoreA??"-"}/${h.scoreB??"-"}</div></div><div class="h-win ${wc}">\uD83C\uDFC6 ${esc(h.winner)}</div></div>`}).join("");
  // Leaderboard
  const ll=document.getElementById("lbList");const sorted=Object.entries(S.elos).sort((a,b)=>b[1]-a[1]).map(([id,elo])=>({id,elo,name:gn(id),prov:gp(id)}));
  document.getElementById("resetEloBtn").style.display=sorted.length?"":"none";
  if(!sorted.length)ll.innerHTML='<div style="text-align:center;color:var(--txt3);padding:24px;font-style:italic;font-size:.8rem">No ratings yet.</div>';
  else{const mx=sorted[0].elo,mn=Math.min(...sorted.map(x=>x.elo),1100);const medals=["\uD83D\uDC51","\uD83E\uDD48","\uD83E\uDD49"];ll.innerHTML=sorted.map((e,i)=>{const pct=mx===mn?100:((e.elo-mn)/(mx-mn))*100;const c=i<3?"var(--txt)":"var(--txt2)";return`<div class="lb-row"><div class="lb-rank" style="color:${c}">${medals[i]||"#"+(i+1)}</div><div class="lb-name" style="color:${c}">${esc(e.name)}</div>${pb(e.prov)}<div><div class="lb-bar" style="width:${Math.max(pct,10)}%;background:${i===0?"linear-gradient(90deg,var(--aqua),var(--green))":"rgba(0,80,120,.06)"}"></div></div><div class="lb-elo" style="color:${e.elo>1200?"var(--teal)":e.elo<1200?"var(--red-a)":"var(--txt3)"}">${e.elo}</div></div>`}).join("")}
}

/* ── Events ── */
document.getElementById("selA").onchange=function(){S.mA=this.value;updFight()};
document.getElementById("selB").onchange=function(){S.mB=this.value;updFight()};
document.getElementById("selJ").onchange=function(){S.jM=this.value;updFight()};
document.getElementById("roundsSlider").oninput=function(){S.rounds=+this.value;document.getElementById("roundsNum").textContent=S.rounds};
document.getElementById("delaySlider").oninput=function(){S.delay=+this.value;document.getElementById("delayNum").textContent=S.delay+"s"};
document.getElementById("autoJBtn").onclick=function(){S.autoJ=!S.autoJ;render()};
document.getElementById("topicInput").oninput=function(){S.topic=this.value;updFight()};
document.getElementById("clearHistBtn").onclick=function(){S.hist=[];sv("arena_hist",S.hist);render()};
document.getElementById("resetEloBtn").onclick=function(){S.elos={};sv("arena_elo",S.elos);render()};

/* ── Battle ── */
document.getElementById("fightBtn").onclick=async function(){
  if(mkKeys().length){S.err="Missing keys: "+mkKeys().map(p=>PROVIDERS[p].name).join(", ");render();return}
  if(!S.topic.trim()){S.err="Enter a topic.";render();return}
  S.err="";S.phase="battling";S.msA=[];S.msB=[];S.judg=null;S.curR=0;S.aborted=false;render();startTimer();
  const nA=gn(S.mA),nB=gn(S.mB);
  document.getElementById("colAName").textContent=nA;document.getElementById("colBName").textContent=nB;
  document.getElementById("colABadge").innerHTML=pb(gp(S.mA));document.getElementById("colBBadge").innerHTML=pb(gp(S.mB));
  document.getElementById("msgsA").innerHTML='<div class="empty">Awaiting...</div>';document.getElementById("msgsB").innerHTML='<div class="empty">Awaiting...</div>';
  document.getElementById("judgmentBox").style.display="none";document.getElementById("resultActions").style.display="none";
  document.getElementById("battleActions").innerHTML='<button class="btn btn-d" id="abortBtn">\u2715 Abort</button>';document.getElementById("abortBtn").onclick=()=>{S.aborted=true};
  const pd=document.getElementById("phaseDisp");pd.className="pulse";
  const sys=getSys(S.mode,S.topic,nA,nB);let hA=[{role:"system",content:sys.a}],hB=[{role:"system",content:sys.b}],cA=[],cB=[];
  try{
    for(let r=0;r<S.rounds;r++){
      if(S.aborted)break;S.curR=r+1;pd.textContent="\u2694 Round "+S.curR+"/"+S.rounds;
      hA.push({role:"user",content:r===0?`The topic is: "${S.topic}"\nYou are ${nA}. Your opponent is ${nB}. Begin with your opening statement now. Be bold and memorable.`:`"${nB}" said:\n"${cB[cB.length-1]}"\n\nRespond directly to their points.`});
      document.getElementById("colA").classList.add("sa");setTimeout(()=>document.getElementById("colA").classList.remove("sa"),400);
      let rA=await callModel(gp(S.mA),gk(gp(S.mA)),S.mA,hA);rA=cleanResponse(rA);if(S.aborted)break;hA.push({role:"assistant",content:rA});cA.push(rA);addMsg("a",S.curR,rA);
      if(S.delay>0)await showCD(S.delay,"Next turn");
      hB.push({role:"user",content:r===0?`The topic is: "${S.topic}"\n"${nA}" just made their opening statement:\n"${rA}"\n\nYou are ${nB}. Deliver your response now.`:`"${nA}" said:\n"${rA}"\n\nFire back with a strong response.`});
      document.getElementById("colB").classList.add("sb");setTimeout(()=>document.getElementById("colB").classList.remove("sb"),400);
      let rB=await callModel(gp(S.mB),gk(gp(S.mB)),S.mB,hB);rB=cleanResponse(rB);if(S.aborted)break;hB.push({role:"assistant",content:rB});cB.push(rB);addMsg("b",S.curR,rB);
      if(r<S.rounds-1&&S.delay>0)await showCD(S.delay,"Next round");
    }
    if(S.aborted){S.phase="setup";stopTimer();render();return}
    if(S.autoJ){
      if(S.delay>0)await showCD(S.delay,"Preparing judgment");pd.textContent="\u2696 Judging...";document.getElementById("battleActions").innerHTML="";
      const tr=cA.map((a,i)=>`--- Round ${i+1} ---\n${nA}: ${a}\n${nB}: ${cB[i]||"(none)"}`).join("\n\n");
      const jR=cleanResponse(await callModel(gp(S.jM),gk(gp(S.jM)),S.jM,[{role:"system",content:"You are a fair, eloquent judge. Be decisive. Respond with your evaluation ONLY, no thinking tags."},{role:"user",content:getJP(S.mode,nA,nB,tr)}],.7,600));
      S.judg=jR;const sc=parseScores(jR,nA,nB);const ne=updateElo(ge(S.mA),ge(S.mB),sc.a||0,sc.b||0);S.elos[S.mA]=ne.a;S.elos[S.mB]=ne.b;sv("arena_elo",S.elos);
      const winner=(sc.a||0)>(sc.b||0)?nA:(sc.b||0)>(sc.a||0)?nB:"Draw";
      S.hist.unshift({date:new Date().toISOString(),mode:S.mode,topic:S.topic.slice(0,80),modelA:S.mA,modelB:S.mB,judge:S.jM,scoreA:sc.a,scoreB:sc.b,winner,rounds:S.rounds});
      if(S.hist.length>50)S.hist=S.hist.slice(0,50);sv("arena_hist",S.hist);
      document.getElementById("judgmentBox").style.display="";document.getElementById("judgmentBox").className="judgment";
      document.getElementById("judgmentBox").innerHTML=`<div class="j-title">\u2696 The Verdict</div><div class="j-sub">Judged by ${esc(gn(S.jM))} (${PROVIDERS[gp(S.jM)]?.name||""})</div><div style="font-size:.82rem">${renderMd(jR)}</div>`;
    }
    S.phase="result";stopTimer();pd.className="";pd.textContent="\u2694 Complete";document.getElementById("battleActions").innerHTML="";
    document.getElementById("resultActions").style.display="flex";
    document.getElementById("resultActions").innerHTML=`<button class="btn" id="newBtn">New Battle</button><button class="btn" id="expBtn">\uD83D\uDCC4 Export</button><button class="btn" id="swapBtn">\uD83D\uDD04 Swap Rematch</button>`;
    document.getElementById("newBtn").onclick=()=>{S.phase="setup";render()};
    document.getElementById("expBtn").onclick=()=>{let t=`THE GRAND ARENA\n${nA} vs ${nB} | ${S.mode} | ${S.rounds}R\nTopic: ${S.topic}\n${"=".repeat(50)}\n\n`;cA.forEach((a,i)=>{t+=`-- Round ${i+1} --\n${nA}: ${a}\n${nB}: ${cB[i]||""}\n\n`});if(S.judg)t+=`\n${"=".repeat(50)}\nJUDGMENT (${gn(S.jM)}):\n${S.judg}`;const el=document.createElement("a");el.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));el.download="arena_"+Date.now()+".txt";el.click()};
    document.getElementById("swapBtn").onclick=()=>{const t=S.mA;S.mA=S.mB;S.mB=t;S.phase="setup";render()};
  }catch(e){S.err=e.message;S.phase="setup";stopTimer();render()}
};
buildSelects();render();
</script>
